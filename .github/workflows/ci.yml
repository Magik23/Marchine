name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.26.8"
          - "1.27.1"

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Verify format, tests, and vet
        run: make check

  quality:
    name: Security and static analysis
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Install pinned Go analyzers
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Run vulnerability analysis
        run: govulncheck ./...

      - name: Run Staticcheck
        run: staticcheck ./...

      - name: Validate shell and desktop integration
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils
          shellcheck scripts/install.sh packaging/finalize-aur.sh packaging/verify-aur.sh
          sed 's|@MARCHINE_BIN@|/usr/bin/marchine|g' packaging/marchine.desktop.in > /tmp/marchine-foot.desktop
          desktop-file-validate /tmp/marchine-foot.desktop
          desktop-file-validate packaging/marchine.desktop
