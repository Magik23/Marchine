# MARCHINE — Game Machinery.
# Copy to: ~/.config/marchine/config.toml
# Emulator executable + primary ROM path can also be edited inside Marchine
# with S. The current automatic Arcade driver is MAME.

# violet | cyan | green | amber
theme = "violet"
startup_source = "arcade"

[arcade]
enabled = true
mame_command = "mame"

# Leave empty to use MAME's rompath / Marchine auto-detection.
# Multiple explicit paths are supported. When explicit paths are configured,
# Marchine passes the complete list to MAME at launch as well as using it for
# indexing. The Setup screen edits the first (primary) path and preserves
# additional paths; clearing the primary field intentionally restores auto-detect.
rom_paths = []
# rom_paths = ["~/ROMs/MAME", "/run/media/me/Arcade/MAME/ROMs"]

# Optional CatVer/category metadata. Marchine does NOT scrape the internet.
# If present, CatVer enables coarse browsing/filter categories.
# Common examples:
# catver_path = "~/.mame/catver.ini"
# catver_path = "~/MAME-Curation/catver.ini"
catver_path = ""

# BIOS/device entries are never shown as games. Clones/preliminary drivers can
# be curated at index time. `hide_junk` is retained as the config key for
# compatibility, while the UI calls it HIDE NON-ARCADE. It is non-destructive:
# ON hides casino/mahjong/etc. from the playlist/categories; the complete
# indexed runnable library remains in the cache.
hide_clones = true
hide_preliminary = true
hide_junk = true

# Flat launch targets. No scraping, ratings, artwork, publisher database, etc.
# Display name is independent from the actual executable/command.

# [[games]]
# name = "OpenTyrian"
# command = "opentyrian"
# args = []

# Steam example (Steam must already be installed/authenticated on the machine):
# [[games]]
# name = "Terminator 2D"
# command = "steam"
# args = ["-applaunch", "1718460"]

# Arbitrary script/example:
# [[games]]
# name = "My Game"
# command = "/home/me/Games/my-game/start.sh"
# args = []
# working_dir = "/home/me/Games/my-game"
